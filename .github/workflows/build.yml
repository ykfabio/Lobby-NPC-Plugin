name: Build ykfabio Network Plugins
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build all three plugins
        run: mvn -B -U clean package
      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: ykfabio-network-plugins
          path: '**/target/*.jar'
          if-no-files-found: error
